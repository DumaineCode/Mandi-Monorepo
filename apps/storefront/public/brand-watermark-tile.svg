<!-- Generated tile for the .brand-watermark CSS utility (src/styles/globals.css).
     Source: /Logo_Crema_trim.png (802x220). Only the ALPHA channel matters - the
     file is consumed as a mask and tinted from CSS, so the artwork colour is
     irrelevant. Geometry: 240x150 tile, mark 100x27.43 at (0,0) and (120,75),
     i.e. a half-drop grid. The padding inside the tile IS the spacing between
     repeats; mask-repeat cannot add gaps by itself. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="150" viewBox="0 0 240 150"><defs><image id="mark" width="100" height="27.43" xlink:href="data:image/png;base64,"/></defs><use xlink:href="#mark" x="0" y="0"/><use xlink:href="#mark" x="120" y="75"/></svg>
